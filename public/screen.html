<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PARTY GO // ГЛАВНЫЙ ЭКРАН</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body class="screen">
<main class="dashboard">
<header class="screen-head">
  <div><div class="eyebrow theme-eyebrow">ПРЯМОЙ ЭФИР // ВЕЧЕРИНКА 2К16</div><h1>PARTY GO <span>LIVE</span></h1></div>
  <div class="screen-right">
    <div class="live"><i></i> В ЭФИРЕ</div>
    <div class="screen-join"><img id="screenJoinQr" src="/qr/join.png" alt="QR для входа"><span>СКАНИРУЙ, ЧТОБЫ ИГРАТЬ</span></div>
  </div>
</header>
<section class="stats">
<article><b id="online">0</b><span>ОНЛАЙН</span></article>
<article><b id="captures">0</b><span>ПОЙМАНО</span></article>
<article><b id="unique">0/0</b><span>ВИДОВ НАЙДЕНО</span></article>
<article><b id="top">—</b><span>ЛИДЕР</span></article>
</section>
<section class="grid">
<div class="panel"><h2>🏆 РЕЙТИНГ ИГРОКОВ</h2><div id="leaderboard"></div></div>
<div class="panel"><h2>⚡ ПОСЛЕДНИЕ ПОИМКИ</h2><div id="recent"></div></div>
</section>
</main>
<script src="/socket.io/socket.io.js"></script>
<script src="/js/theme.js"></script>
<script src="/js/screen.js"></script>
</body>
</html>
